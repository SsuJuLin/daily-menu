<style>
:root{
  --bg:#EEF4EA; --surface:#FFFFFF; --ink:#173A33; --muted:#5C7A6E; --line:rgba(23,58,51,.12);
  --lily:#4E8F1F; --lotus:#C9507A; --water:#2E7FA8; --violet:#7D55B8; --amber:#B9770E;
  --on-accent:#FFFFFF; --marker:#B9DCA0;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12302B; --surface:#1A3C36; --ink:#EAF2E3; --muted:#9DB5A8; --line:rgba(234,242,227,.12);
    --lily:#8CC63F; --lotus:#F08CA8; --water:#6FB7D9; --violet:#B99AE8; --amber:#F2B84B;
    --on-accent:#12302B; --marker:#2F6B4F;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12302B; --surface:#1A3C36; --ink:#EAF2E3; --muted:#9DB5A8; --line:rgba(234,242,227,.12);
  --lily:#8CC63F; --lotus:#F08CA8; --water:#6FB7D9; --violet:#B99AE8; --amber:#F2B84B;
  --on-accent:#12302B; --marker:#2F6B4F; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
button,a{-webkit-tap-highlight-color:transparent}
button{-webkit-user-select:none;user-select:none;touch-action:manipulation}
body{margin:0;overscroll-behavior-y:none;background:var(--bg);color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--lily);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:20px 18px 120px}

/* header */
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.date{font-family:"Noto Serif TC",serif;font-weight:900;font-size:30px;line-height:1.15;margin:0;letter-spacing:.02em}
.weekday{color:var(--muted);font-size:15px;margin-top:4px}
.iconbtn{background:none;border:1px solid var(--line);border-radius:12px;width:42px;height:42px;display:grid;place-items:center;cursor:pointer;font-size:18px;flex:none}

/* drum head */
.head{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;margin:26px 0 10px}
.drum{width:150px;height:150px;position:relative}
.drum svg{width:100%;height:100%;display:block}
.drum .center{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.drum .count{font-family:"Noto Serif TC",serif;font-weight:900;font-size:38px;line-height:1;font-variant-numeric:tabular-nums}
.drum .countsub{font-size:12px;color:var(--muted);margin-top:4px}
.stats{display:grid;gap:10px}
.stat{font-size:15px;color:var(--muted)}
.stat b{display:block;color:var(--ink);font-size:20px;font-weight:700;font-variant-numeric:tabular-nums}
.drum circle.arc{transition:stroke-dashoffset .6s ease}
@media (prefers-reduced-motion:reduce){.drum circle.arc{transition:none}}

/* gig countdown */
.gigs{display:flex;gap:10px;margin:22px -18px 4px;padding:0 18px 4px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x proximity;scroll-padding-left:18px}
.gigs::-webkit-scrollbar{display:none}
.gigs .gig{flex:0 0 126px;scroll-snap-align:start}
.gig{min-height:0;border:1.5px solid var(--line);border-radius:18px;padding:9px 8px 10px;cursor:pointer;color:inherit;font:inherit;width:100%;gap:3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center;background:var(--surface)}
.gig .gname{font-weight:700;font-size:13px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.gig .gnum{font-family:"Noto Serif TC",serif;font-weight:900;font-size:30px;line-height:1.05;color:var(--amber);font-variant-numeric:tabular-nums}
.gig .gnum small{font-size:13px;font-weight:700;margin-left:2px;color:var(--ink)}
.gig .ginfo{font-size:11px;white-space:nowrap;color:var(--muted);line-height:1.4}

/* sections */
section{margin-top:30px}
section h2{font-family:"Noto Serif TC",serif;font-weight:900;font-size:22px;margin:0 0 8px;display:flex;align-items:baseline;gap:10px}
section h2 .mark{background:linear-gradient(transparent 55%,var(--marker) 55%, var(--marker) 92%,transparent 92%);padding:0 4px}
section h2 small{font-family:"Noto Sans TC",sans-serif;font-weight:400;font-size:13px;color:var(--muted)}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;cursor:pointer}
.row:last-child{border-bottom:0}
.tick{flex:none;width:28px;height:28px;border-radius:50%;border:2.5px solid var(--c,var(--lily));display:grid;place-items:center;font-size:15px;font-weight:700;color:var(--on-accent)}
.row.done .tick{background:var(--c,var(--lily))}
.row.done .name{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1.5px}
.meta{flex:1;min-width:0}
.name{font-weight:500;font-size:16px;display:block}
.sub{font-size:13px;color:var(--muted);display:block}
.short{font-weight:700;color:var(--c,var(--lily));margin-right:6px}
.age{flex:none;font-size:12px;color:var(--muted);text-align:right}
.age.stale{color:var(--lotus)}
.empty{color:var(--muted);font-size:15px;padding:12px 0}

.more{margin-top:28px;width:100%;padding:14px;border-radius:14px;border:1.5px dashed var(--line);background:none;cursor:pointer;color:var(--muted);font-size:15px}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;z-index:20}
.scrim.open{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:var(--surface);border-radius:20px 20px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom,0px));max-height:85vh;overflow:auto;transform:translateY(100%);transition:transform .25s ease;max-width:560px;margin:0 auto}
.sheet.open{transform:none}
@media (prefers-reduced-motion:reduce){.sheet{transition:none}}
.sheet h3{font-family:"Noto Serif TC",serif;font-size:21px;margin:0 0 4px}
.sheet .hint{color:var(--muted);font-size:14px;margin:0 0 18px}
.field{margin-bottom:16px}
.field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px}
.field input,.field textarea{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.stepper{display:grid;grid-template-columns:52px 1fr 52px;gap:8px}
.stepper button{border-radius:12px;border:1.5px solid var(--line);background:var(--bg);font-size:18px;cursor:pointer}
.stepper input{text-align:center;font-weight:700;font-variant-numeric:tabular-nums}
.primary{width:100%;padding:15px;border:0;border-radius:14px;background:var(--lily);color:var(--on-accent);font-weight:700;font-size:17px;cursor:pointer}
.primary:disabled{opacity:.5}
.ghost{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:14px;background:none;cursor:pointer;margin-top:10px;font-size:15px}
.choices{display:grid;gap:10px;margin-bottom:12px}
.choice{padding:14px;border-radius:14px;border:1.5px solid var(--line);background:var(--bg);cursor:pointer;text-align:left;font-size:16px}
.choice.on{border-color:var(--lily);box-shadow:inset 0 0 0 1.5px var(--lily)}
.link{display:inline-block;margin:0 0 16px;color:var(--water);font-size:15px}
.pick{display:flex;justify-content:space-between;width:100%;padding:13px 2px;border:0;border-bottom:1px solid var(--line);background:none;cursor:pointer;text-align:left}
.pick span{color:var(--muted);font-size:13px}
.group{font-size:13px;color:var(--muted);margin:16px 0 2px}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:999px;font-size:15px;z-index:30;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
.notice{background:var(--surface);border-radius:16px;padding:18px;margin-top:24px}
.notice p{margin:0 0 12px}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs div{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.tab{background:none;border:0;padding:14px 0 12px;font-size:15px;color:var(--muted);cursor:pointer}
.tab.on{color:var(--ink);font-weight:700;box-shadow:inset 0 3px 0 var(--lily)}
.row.later{opacity:.55}
/* tracking */
.trow{display:grid;grid-template-columns:1fr 96px 64px;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:14px 2px;cursor:pointer}
.trow:last-child{border-bottom:0}
.trow .val{text-align:right;font-variant-numeric:tabular-nums}
.trow .val b{display:block;font-size:17px}
.trow .val span{font-size:12px;color:var(--muted)}
.spark{width:96px;height:32px;display:block}
.chart{width:100%;height:auto;display:block;margin:6px 0 14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:4px 0 16px}
.kpi{background:var(--bg);border-radius:12px;padding:10px 12px}
.kpi b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--muted)}
.hist{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px;margin-bottom:16px}
.hist .d{color:var(--muted);font-variant-numeric:tabular-nums}
.danger{color:var(--lotus)}
.mhead{font-family:"Noto Sans TC",sans-serif;font-weight:500;font-size:15px;color:var(--muted);margin-left:12px;letter-spacing:0;white-space:nowrap}
.mhead b{color:var(--ink);font-size:20px;font-weight:700;margin:0 2px;font-variant-numeric:tabular-nums}
.head{grid-template-columns:150px 1fr;gap:16px;align-items:center;justify-content:space-between}
.mstat{text-align:center;white-space:nowrap}
.mstat b{display:block;font-family:"Noto Serif TC",serif;font-weight:900;font-size:28px;line-height:1.1;font-variant-numeric:tabular-nums}
.mstat b small{font-family:"Noto Sans TC",sans-serif;font-size:13px;font-weight:700;margin-left:2px}
.mstat span{font-size:12px;color:var(--muted)}
.head .punch{flex-direction:column;align-items:stretch;gap:12px;margin:0;padding:16px 14px;border-radius:18px}
.head .punch .pt b{font-size:18px}
.head .punch .pt span{font-size:13px;display:block;line-height:1.35;white-space:nowrap;letter-spacing:-.02em}
.head .punch button{padding:12px 8px;width:100%;font-size:16px;border-radius:12px}
.week{display:grid;grid-template-columns:22px repeat(7,1fr) 22px;gap:4px;align-items:center;margin-top:18px}
.wnav{background:none;border:0;font-size:22px;color:var(--muted);cursor:pointer;padding:0}
.wnav:disabled{opacity:.25}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 0 6px;border:0;border-radius:16px;background:none;cursor:pointer}
.wd small{font-size:12px;color:var(--muted)}
.wd b{font-size:16px;font-variant-numeric:tabular-nums;width:34px;height:34px;display:grid;place-items:center;border-radius:50%;background:var(--surface)}
.wd.today b{box-shadow:inset 0 0 0 1.5px var(--lily)}
.wd.on{background:var(--marker)}
.wd.on b{background:var(--lily);color:var(--on-accent)}
.wd:disabled{opacity:.3;cursor:default}
.wd i{width:5px;height:5px;border-radius:50%}
.wd i.has{background:var(--lily)}
.backfill{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;padding:10px 14px;border-radius:12px;background:color-mix(in srgb,var(--amber) 18%,transparent);font-size:14px}
.backfill button{flex:none;border:0;background:var(--amber);color:var(--on-accent);border-radius:10px;padding:7px 12px;font-weight:700;cursor:pointer}
.menuchips{margin-top:22px}
.donebox{margin-top:30px}
.donehead{display:flex;justify-content:space-between;align-items:center;width:100%;background:var(--surface);border:0;border-radius:14px;padding:13px 16px;font-size:15px;cursor:pointer;color:var(--muted)}
.caret{transition:transform .2s;font-size:18px}
.caret.up{transform:rotate(180deg)}
.shead{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.shead h3{padding-top:6px}
.sbtns{display:flex;gap:8px;flex:none}
#lk:empty{display:none}
a.iconbtn{text-decoration:none}
.seg.three{grid-template-columns:repeat(3,1fr)}
.chips{display:flex;gap:8px;overflow-x:auto;margin:14px 0 4px;padding-bottom:2px}
.chip{flex:none;border:1.5px solid var(--line);background:none;border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer;color:var(--muted)}
.chip.on{border-color:var(--lily);color:var(--ink);font-weight:700}
.pnav{display:flex;align-items:center;justify-content:center;gap:18px;margin:12px 0}
.pnav button{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:none;font-size:20px;cursor:pointer}
.pnav b{font-size:17px;min-width:140px;text-align:center}
.card{background:var(--surface);border-radius:20px;padding:16px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;text-align:center}
.cal .w{font-size:12px;color:var(--muted);padding-bottom:2px}
.cal .c{aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:14px;font-variant-numeric:tabular-nums;position:relative}
.cal.y{grid-template-columns:repeat(4,1fr)}
.cal.y .c{aspect-ratio:auto;border-radius:12px;padding:10px 4px;display:block}
.cal.y .c b{display:block;font-size:14px}.cal.y .c span{font-size:12px}
.l1{background:color-mix(in srgb,var(--lily) 22%,transparent)}
.l2{background:color-mix(in srgb,var(--lily) 42%,transparent)}
.l3{background:color-mix(in srgb,var(--lily) 66%,transparent)}
.l4{background:var(--lily);color:var(--on-accent)}
.off{opacity:.35}
.cal .c.today::after{content:"";position:absolute;bottom:2px;width:4px;height:4px;border-radius:50%;background:var(--ink)}
.ringbox{position:relative;width:130px;margin:18px auto 8px}
.ring{width:130px;height:130px;display:block}
.rc{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.rc b{font-family:"Noto Serif TC",serif;font-size:24px;font-variant-numeric:tabular-nums}
.rc span{font-size:12px;color:var(--muted)}
.kpis.four{grid-template-columns:repeat(2,1fr);margin:10px 0 0}
.habits{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.hcard{border:1.5px solid color-mix(in srgb,var(--c) 45%,transparent);border-radius:16px;background:var(--surface);padding:10px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px;min-width:0}
.hname{font-weight:700;font-size:14px;color:var(--c);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}
.mini.y{grid-template-columns:repeat(6,1fr)}
.mini i{font-style:normal;aspect-ratio:1;border-radius:5px;background:var(--line);font-size:9px;display:grid;place-items:center;color:var(--muted)}
.mini i.blank{background:none}
.mini i.l4{background:var(--c);color:var(--on-accent)}
.mini.y i.l1,.mini.y i.l2,.mini.y i.l3{background:color-mix(in srgb,var(--c) 45%,transparent)}
.hfoot{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;color:var(--muted)}
.hfoot b{font-size:15px;color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface);border-radius:12px;padding:4px;margin-top:22px}
.seg button{border:0;background:none;padding:9px;border-radius:9px;font-size:15px;color:var(--muted);cursor:pointer}
.seg button.on{background:var(--bg);color:var(--ink);font-weight:700}
.day{margin-top:26px}
.day h3{font-family:"Noto Serif TC",serif;font-size:18px;margin:0 0 4px;display:flex;justify-content:space-between;align-items:baseline}
.day h3 small{font-family:"Noto Sans TC",sans-serif;font-weight:400;font-size:13px;color:var(--muted)}
.rec{display:grid;grid-template-columns:1fr auto;gap:2px 12px;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 2px;cursor:pointer}
.rec:last-child{border-bottom:0}
.rec .r1{font-weight:500}
.rec .r2{text-align:right;font-variant-numeric:tabular-nums}
.rec .r3{grid-column:1/-1;font-size:13px;color:var(--muted)}
.ver{border-left:3px solid var(--marker);padding:2px 0 2px 12px;margin-bottom:16px}
.ver b{font-size:15px}
.ver span{font-size:13px;color:var(--muted);margin-left:8px}
.ver ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.gig.add{min-height:76px;border-style:dashed;background:none;justify-content:center;color:var(--muted);font-size:14px}
.punch{display:flex;align-items:center;gap:14px;background:var(--surface);border-radius:18px;padding:14px 16px;margin-top:18px}
.punch .pt{flex:1;min-width:0}
.punch .pt b{display:block;font-size:17px}
.punch .pt span{font-size:13px;color:var(--muted)}
.punch button{flex:none;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:var(--lily);color:var(--on-accent)}
.punch.on{box-shadow:inset 0 0 0 2px var(--lily)}
.punch.on button{background:var(--lotus)}
.songrow{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.songrow span{flex:1}
.songrow small{color:var(--muted)}
.songrow button{background:none;border:0;color:var(--muted);font-size:18px;cursor:pointer;padding:4px 8px}
.addsong{display:grid;grid-template-columns:1fr auto;gap:8px;margin:12px 0 18px}
.addsong input{font:inherit;font-size:17px;padding:11px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.addsong button{border:0;border-radius:12px;padding:0 16px;background:var(--lily);color:var(--on-accent);font-weight:700;cursor:pointer}
.field select{width:100%;font:inherit;font-size:17px;padding:12px 14px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.textbtn{background:none;border:0;color:var(--water);font-size:15px;padding:0;cursor:pointer;margin:0 0 16px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 class="date" id="date"></h1>
      <div class="weekday" id="weekday"></div>
    </div>
    <div style="display:flex;gap:8px">
      <button class="iconbtn" id="btnSettings" aria-label="設定">⚙︎</button>
    </div>
  </div>
  <main id="main"><p class="empty">讀取中…</p></main>
</div>
<nav class="tabs"><div>
  <button class="tab on" data-v="today">今日菜單</button>
  <button class="tab" data-v="track">成長追蹤</button>
  <button class="tab" data-v="records">紀錄</button>
</div></nav>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
<div class="toast" id="toast"></div>

<script>
const CONFIG = {
  PROXY: 'https://notion-proxy.doristtn.workers.dev/?url=',
  VERSION: '2022-06-28',
  START: '2026-10-26', // 第一天
  DB: {
    items:    '2efe9ad9c8264368896193e84e671be9', // 成長項目
    logs:     'edd62a8b069c4bdf8b68d428fa95e9cb', // 成長紀錄
    sessions: '1c2c85b85e024189b0114153b9fa8f41', // 練習紀錄
    gigs:     '61f409238f794316b3812d0455b4639f', // 演出
    songs:    '90785fa1ea92484593c37744cb5904d2', // 歌曲
  },
};
const DOMAIN_COLOR = { '爵士鼓':'var(--lily)', '樂理':'var(--water)', '日文':'var(--lotus)', '編曲':'var(--violet)' };
const CAT_ORDER = ['手法', '句子', '教材', '雙踏', '律動', '過門', '讀譜'];
const TOKEN_KEY = 'dailyMenu.notionToken';

/* ---------- 日期 ---------- */
const iso = d => d.toLocaleDateString('sv-SE');
const TODAY = iso(new Date());
const addDays = (s, n) => { const d = new Date(s + 'T00:00:00'); d.setDate(d.getDate() + n); return iso(d); };
const daysBetween = (a, b) => Math.round((Date.parse(b + 'T00:00:00') - Date.parse(a + 'T00:00:00')) / 86400000);
const md = s => { const [, m, d] = s.split('-'); return `${+m}/${+d}`; };
const DAY_INDEX = daysBetween(CONFIG.START, TODAY); // 0 = 第一天

/* ---------- 狀態 ---------- */
let token = localStorage.getItem(TOKEN_KEY) || findSharedToken();
let view = 'today';
const S = { items: [], logs: [], gigs: [], songs: [], sessions: [], allSessions: [], open: null, session: null, songsDone: new Set(), loaded: false };

function findSharedToken() {
  for (let i = 0; i < localStorage.length; i++) {
    const v = (localStorage.getItem(localStorage.key(i)) || '').trim();
    if (/^(ntn_|secret_)[A-Za-z0-9]{20,}$/.test(v)) return v;
  }
  return '';
}

/* ---------- Notion ---------- */
async function notion(path, method = 'GET', body) {
  const res = await fetch(CONFIG.PROXY + encodeURIComponent('https://api.notion.com/v1/' + path), {
    method,
    headers: { 'Authorization': 'Bearer ' + token, 'Notion-Version': CONFIG.VERSION, 'Content-Type': 'application/json' },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.message || ('HTTP ' + res.status));
  return data;
}
async function queryAll(db, body = {}) {
  const out = []; let cursor = null;
  do {
    const r = await notion(`databases/${db}/query`, 'POST', { ...body, page_size: 100, ...(cursor ? { start_cursor: cursor } : {}) });
    out.push(...r.results); cursor = r.has_more ? r.next_cursor : null;
  } while (cursor);
  return out;
}
const nid = s => s.replace(/-/g, '');
const P = {
  title: p => (p?.title || []).map(t => t.plain_text).join(''),
  text:  p => (p?.rich_text || []).map(t => t.plain_text).join(''),
  sel:   p => p?.select?.name || '',
  num:   p => (typeof p?.number === 'number' ? p.number : null),
  chk:   p => !!p?.checkbox,
  date:  p => (p?.date?.start || '').slice(0, 10),
  rel:   p => (p?.relation || []).map(r => nid(r.id)),
};
const parseItem = pg => { const p = pg.properties; return {
  id: nid(pg.id), name: P.title(p['名稱']), domain: P.sel(p['領域']), cat: P.sel(p['分類']), short: P.text(p['簡稱']),
  bpm: P.num(p['目前BPM']), prog: P.num(p['目前進度']), target: P.num(p['目標']), unit: P.text(p['單位']),
  perWeek: P.num(p['每週次數']), active: P.chk(p['啟用']) }; };
const parseLog = pg => { const p = pg.properties; return {
  id: nid(pg.id), item: P.rel(p['項目'])[0] || '', date: P.date(p['日期']), bpm: P.num(p['BPM']), prog: P.num(p['進度']), note: P.text(p['備註']) }; };
const parseSong = pg => { const p = pg.properties; return {
  id: nid(pg.id), name: P.title(p['歌名']), status: P.sel(p['狀態']), last: P.date(p['上次練習']), gigs: P.rel(p['演出']) }; };

/* ---------- 讀取 ---------- */
async function load(quiet) {
  if (!token) return renderSetup();
  if (!quiet || !S.loaded) main.innerHTML = '<p class="empty">讀取中…</p>';
  try {
    const [items, logs, gigs, sessions] = await Promise.all([
      // 練習紀錄先整理打卡，再一起讀
      queryAll(CONFIG.DB.items),
      queryAll(CONFIG.DB.logs, { filter: { property: '日期', date: { on_or_after: CONFIG.START } }, sorts: [{ property: '日期', direction: 'ascending' }] }),
      queryAll(CONFIG.DB.gigs, { filter: { property: '日期', date: { on_or_after: TODAY } }, sorts: [{ property: '日期', direction: 'ascending' }] }),
      syncSessions(),
    ]);
    S.items = items.map(parseItem);
    S.logs = logs.map(parseLog);
    S.allSessions = sessions;
    S.sessions = sessions.filter(r => r.start.slice(0, 10) === TODAY);
    S.open = S.sessions.find(r => !r.end) || null;
    S.session = S.open ? S.open.id : (S.sessions.length ? S.sessions[S.sessions.length - 1].id : null);
    S.gigs = gigs.map(g => ({ id: nid(g.id), name: P.title(g.properties['名稱']), date: P.date(g.properties['日期']), place: P.text(g.properties['地點']), band: P.sel(g.properties['團']) }));
    S.songs = [];
    if (gigs.length) {
      const songs = await queryAll(CONFIG.DB.songs, { filter: { or: gigs.map(g => ({ property: '演出', relation: { contains: g.id } })) } });
      S.songs = songs.map(parseSong).map(s => {
        const g = S.gigs.find(g => s.gigs.includes(g.id)); // 最近的一場
        return { ...s, gig: g ? g.id : '' };
      });
    }
    S.songsDone = new Set(JSON.parse(localStorage.getItem('dailyMenu.songsDone.' + TODAY) || '[]'));
    S.loaded = true;
    render();
  } catch (e) {
    main.innerHTML = `<div class="notice"><p><b>讀不到 Notion 資料</b></p><p>${esc(e.message)}</p>
      <p>請確認「今日菜單」頁面已連接 integration「爵士鼓教學系統」，而且 token 正確。</p>
      <button class="primary" onclick="openSettings()">檢查 token</button></div>`;
  }
}

/* ---------- 計算 ---------- */
const logsOf = id => S.logs.filter(l => l.item === id);
const lastDate = id => { const l = logsOf(id); return l.length ? l[l.length - 1].date : ''; };
let VIEW = TODAY, menuFilter = '全部', doneOpen = false;
const doneOn = (id, d) => S.logs.some(l => l.item === id && l.date === d);
const doneToday = id => doneOn(id, VIEW);
const songsDoneOn = d => new Set(JSON.parse(localStorage.getItem('dailyMenu.songsDone.' + d) || '[]'));
const isCourse = it => (it.perWeek || 0) > 0;
const interval = it => Math.max(1, Math.round(7 / it.perWeek));
const finished = it => it.target != null && it.prog != null && it.prog >= it.target;
function expectedLesson(it) { // 照進度，今天應該上到第幾堂
  const di = daysBetween(CONFIG.START, VIEW);
  if (di < 0) return 0;
  return Math.min(it.target || Infinity, Math.floor(di / interval(it)) + 1);
}
const courseDue = it => !finished(it) && ((it.prog || 0) < expectedLesson(it) || doneToday(it.id));

function monthDays() {
  const m = TODAY.slice(0, 7);
  return new Set(S.logs.filter(l => l.date.startsWith(m)).map(l => l.date)).size;
}

/* ---------- 共用畫面 ---------- */
const main = document.getElementById('main');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const colorOf = it => DOMAIN_COLOR[it.domain] || 'var(--lily)';
function ageText(id) {
  const last = lastDate(id);
  if (!last) return ['還沒練過', false];
  const n = daysBetween(last, TODAY);
  return [n === 0 ? '今天' : n === 1 ? '昨天' : `${n} 天前`, n >= 7];
}
function header() {
  const d = new Date(TODAY + 'T00:00:00');
  document.getElementById('date').innerHTML = `${d.getMonth() + 1} 月 ${d.getDate()} 日` + (S.loaded ? `<span class="mhead">本月累積 <b>${monthDays()}</b> 天</span>` : '');
  document.getElementById('weekday').textContent = '星期' + '日一二三四五六'[d.getDay()] + '，' +
    (DAY_INDEX >= 0 ? `第 ${DAY_INDEX + 1} 天` : `${md(CONFIG.START)} 開始第 1 天`);
}
function section(title, note, rows) { return `<section><h2><span class="mark">${esc(title)}</span><small>${note || ''}</small></h2>${rows}</section>`; }
function render() { header(); if (!S.loaded) return; view === 'today' ? renderToday() : view === 'track' ? renderTrack() : renderRecords(); }

/* ---------- 今日菜單 ---------- */
function drumSVG(done, total) {
  const r = 58, c = 2 * Math.PI * r, frac = total ? done / total : 0;
  const lugs = Array.from({ length: 8 }, (_, i) => {
    const a = (i / 8) * 2 * Math.PI - Math.PI / 2;
    return `<circle cx="${75 + 71 * Math.cos(a)}" cy="${75 + 71 * Math.sin(a)}" r="3.2" fill="var(--muted)" opacity=".7"/>`;
  }).join('');
  return `<svg viewBox="0 0 150 150" aria-hidden="true"><circle cx="75" cy="75" r="66" fill="var(--surface)"/>${lugs}
    <circle cx="75" cy="75" r="${r}" fill="none" stroke="var(--line)" stroke-width="9"/>
    <circle class="arc" cx="75" cy="75" r="${r}" fill="none" stroke="var(--lily)" stroke-width="9" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - frac)}" transform="rotate(-90 75 75)"/></svg>`;
}

function weekStrip() {
  const dow = (new Date(VIEW + 'T00:00:00').getDay() + 6) % 7, mon = addDays(VIEW, -dow);
  const days = Array.from({ length: 7 }, (_, i) => addDays(mon, i));
  return `<div class="week"><button class="wnav" aria-label="上一週" onclick="moveWeek(-7)">‹</button>${days.map((d, i) => {
    const off = d > TODAY || d < CONFIG.START, any = S.logs.some(l => l.date === d);
    return `<button class="wd ${d === VIEW ? 'on' : ''} ${d === TODAY ? 'today' : ''}" ${off ? 'disabled' : ''} onclick="setView('${d}')">
      <small>${'一二三四五六日'[i]}</small><b>${+d.slice(8)}</b><i class="${any ? 'has' : ''}"></i></button>`;
  }).join('')}<button class="wnav" aria-label="下一週" onclick="moveWeek(7)" ${addDays(mon, 7) > TODAY ? 'disabled' : ''}>›</button></div>`;
}
function setView(d) { VIEW = d; doneOpen = false; render(); }
function moveWeek(n) {
  let d = addDays(VIEW, n);
  if (d > TODAY) d = TODAY;
  if (d < CONFIG.START) d = CONFIG.START;
  setView(d);
}

function renderToday() {
  const isToday = VIEW === TODAY;
  S.songsDone = songsDoneOn(VIEW);
  const active = S.items.filter(i => i.active);
  const courses = active.filter(isCourse);
  const dueCourses = courses.filter(courseDue);
  const practice = active.filter(i => !isCourse(i));
  const counted = [...dueCourses, ...practice];
  const songsAll = S.songs.filter(s => s.status !== '可以上台' || S.songsDone.has(s.id));
  const total = counted.length + songsAll.length;
  const done = counted.filter(i => doneToday(i.id)).length + songsAll.filter(s => S.songsDone.has(s.id)).length;

  let html = '';
  const backfill = isToday ? '' : `<div class="backfill"><span>正在看 ${md(VIEW)} 星期${'日一二三四五六'[new Date(VIEW + 'T00:00:00').getDay()]}，記錄會存到這一天</span><button onclick="setView(TODAY)">回到今天</button></div>`;
  html += `<div class="head">
    <div class="drum">${drumSVG(done, total)}
      <div class="center"><div><div class="count">${done}/${total}</div><div class="countsub">${total && done === total ? '全部完成' : '已完成'}</div></div></div></div>
    ${isToday ? punchCard() : '<div></div>'}
    </div>` + weekStrip() + backfill;
  if (isToday) {
    html += `<div class="gigs">${S.gigs.map(g => {
      const n = daysBetween(TODAY, g.date), all = S.songs.filter(s => s.gig === g.id);
      const pending = all.filter(s => s.status !== '可以上台').length;
      return `<button class="gig" onclick="openGig('${g.id}')"><div class="gname">${esc(g.name)}</div>
        <div class="gnum">${n === 0 ? '今天' : n}${n === 0 ? '' : '<small>天</small>'}</div>
        <div class="ginfo">${md(g.date)}，${!all.length ? '歌單未出' : pending ? pending + ' 首未完成' : '全部完成'}</div></button>`;
    }).join('')}<button class="gig add" onclick="openGig()">＋ 新增演出</button></div>`;
  }

  // 篩選標籤
  const drum = practice.filter(i => i.domain === '爵士鼓');
  const others = practice.filter(i => i.domain !== '爵士鼓');
  const chips = ['全部'];
  if (courses.length) chips.push('網課');
  if (drum.length) chips.push('爵士鼓');
  [...new Set(others.map(i => i.domain || '其他'))].forEach(d => chips.push(d));
  if (songsAll.length) chips.push('歌曲');
  if (!chips.includes(menuFilter)) menuFilter = '全部';
  html += `<div class="chips menuchips">${chips.map(c => `<button class="chip ${menuFilter === c ? 'on' : ''}" onclick="menuFilter='${c}';render()">${c}</button>`).join('')}</div>`;
  const show = c => menuFilter === '全部' || menuFilter === c;

  const doneRows = [];
  if (show('網課') && courses.length) {
    const left = courses.filter(c => !doneToday(c.id)).sort((a, b) => courseDue(b) - courseDue(a));
    courses.filter(c => doneToday(c.id)).forEach(c => doneRows.push(courseRow(c)));
    if (left.length) html += section('網課', `${dueCourses.filter(c => !doneToday(c.id)).length} 門${isToday ? '今天' : '這天'}要上`, left.map(courseRow).join(''));
  }
  if (show('爵士鼓')) {
    const cats = [...new Set(drum.map(i => i.cat || '其他'))].sort((a, b) => (CAT_ORDER.indexOf(a) + 99) % 99 - (CAT_ORDER.indexOf(b) + 99) % 99);
    cats.forEach(c => {
      const list = drum.filter(i => (i.cat || '其他') === c);
      list.filter(i => doneToday(i.id)).forEach(i => doneRows.push(itemRow(i)));
      const left = list.filter(i => !doneToday(i.id));
      if (left.length) html += section(c, '爵士鼓', left.map(itemRow).join(''));
    });
  }
  [...new Set(others.map(i => i.domain || '其他'))].filter(show).forEach(d => {
    const list = others.filter(i => (i.domain || '其他') === d);
    list.filter(i => doneToday(i.id)).forEach(i => doneRows.push(itemRow(i)));
    const left = list.filter(i => !doneToday(i.id));
    if (left.length) html += section(d, '', left.map(itemRow).join(''));
  });
  if (show('歌曲')) S.gigs.forEach(g => {
    const list = songsAll.filter(s => s.gig === g.id);
    list.filter(s => S.songsDone.has(s.id)).forEach(s => doneRows.push(songRow(s)));
    const left = list.filter(s => !S.songsDone.has(s.id));
    if (left.length) html += section(g.name, `${md(g.date)} 演出歌曲`, left.map(songRow).join(''));
  });
  if (!total && !courses.length) html += `<p class="empty">還沒有項目，新增一個開始練習。</p>`;
  if (doneRows.length) html += `<section class="donebox"><button class="donehead" onclick="doneOpen=!doneOpen;render()">
      <span>${isToday ? '今天' : '這天'}已完成 ${doneRows.length} 項</span><span class="caret ${doneOpen ? 'up' : ''}">⌄</span></button>
      ${doneOpen ? doneRows.join('') : ''}</section>`;
  html += `<button class="more" onclick="openEdit()">＋ 新增練習項目</button>`;
  main.innerHTML = html;
}

function courseRow(it) {
  const d = doneToday(it.id), due = courseDue(it), prog = it.prog || 0;
  let sub;
  if (finished(it)) sub = `全部 ${it.target} 堂上完了`;
  else if (d) sub = `已上到第 ${prog} 堂，共 ${it.target}`;
  else if (due) {
    const behind = expectedLesson(it) - prog - 1;
    sub = `${VIEW === TODAY ? '今天' : '這天'}上第 ${prog + 1} 堂，共 ${it.target}` + (behind > 0 ? `　落後 ${behind} 堂` : '');
  } else sub = `已上到第 ${prog} 堂，下一堂 ${md(addDays(CONFIG.START, prog * interval(it)))}`;
  return `<button class="row ${d ? 'done' : ''} ${!due && !d ? 'later' : ''}" style="--c:${colorOf(it)}" onclick="openLog('${it.id}')">
    <span class="tick">${d ? '✓' : ''}</span>
    <span class="meta"><span class="name">${esc(it.name)}</span><span class="sub">${sub}</span></span></button>`;
}
function itemRow(it) {
  const d = doneToday(it.id), [age, stale] = ageText(it.id);
  const parts = [];
  if (it.unit && it.prog != null) parts.push(`第 ${it.prog} ${it.unit}`);
  if (it.bpm != null) parts.push(`最高 ${it.bpm} BPM`);
  return `<button class="row ${d ? 'done' : ''}" style="--c:${colorOf(it)}" onclick="openLog('${it.id}')">
    <span class="tick">${d ? '✓' : ''}</span>
    <span class="meta"><span class="name">${it.short ? `<span class="short">${esc(it.short)}</span>` : ''}${esc(it.name)}</span>${parts.length ? `<span class="sub">${parts.join('　')}</span>` : ''}</span>
    <span class="age ${stale && !d ? 'stale' : ''}">${d ? '' : age}</span></button>`;
}
function songRow(s) {
  const d = S.songsDone.has(s.id);
  const n = s.last ? daysBetween(s.last, TODAY) : null;
  return `<button class="row ${d ? 'done' : ''}" style="--c:var(--amber)" onclick="openSong('${s.id}')">
    <span class="tick">${d ? '✓' : ''}</span>
    <span class="meta"><span class="name">${esc(s.name)}</span><span class="sub">${esc(s.status || '未抓歌')}</span></span>
    <span class="age">${d ? '' : n == null ? '還沒練過' : n === 0 ? '今天' : n + ' 天前'}</span></button>`;
}

/* ---------- 成長追蹤 ---------- */
function series(it) { // 優先用 BPM，沒有就用進度
  const L = logsOf(it.id);
  const bpm = L.filter(l => l.bpm != null).map(l => ({ date: l.date, v: l.bpm }));
  const prog = L.filter(l => l.prog != null).map(l => ({ date: l.date, v: l.prog }));
  if (bpm.length) return { kind: 'BPM', pts: bpm };
  return { kind: it.unit || '進度', pts: prog };
}
function sparkSVG(pts, color) {
  if (pts.length < 2) return `<svg class="spark" viewBox="0 0 96 32"><line x1="2" y1="16" x2="94" y2="16" stroke="var(--line)" stroke-width="2" stroke-dasharray="3 4"/></svg>`;
  const vs = pts.map(p => p.v), lo = Math.min(...vs), hi = Math.max(...vs), span = hi - lo || 1;
  const xy = pts.map((p, i) => `${2 + (i / (pts.length - 1)) * 92},${28 - ((p.v - lo) / span) * 24}`).join(' ');
  return `<svg class="spark" viewBox="0 0 96 32"><polyline points="${xy}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/></svg>`;
}
function chartSVG(pts, color, unit) {
  const W = 320, H = 170, L = 34, R = 10, T = 14, B = 26;
  if (!pts.length) return `<p class="empty">還沒有紀錄，練完記一筆就會開始畫線。</p>`;
  const d0 = pts[0].date, dN = pts[pts.length - 1].date, dSpan = Math.max(1, daysBetween(d0, dN));
  const vs = pts.map(p => p.v); let lo = Math.min(...vs), hi = Math.max(...vs);
  if (lo === hi) { lo -= 5; hi += 5; } const pad = (hi - lo) * .12; lo -= pad; hi += pad;
  const x = p => L + (pts.length === 1 ? (W - L - R) / 2 : (daysBetween(d0, p.date) / dSpan) * (W - L - R));
  const y = v => T + (1 - (v - lo) / (hi - lo)) * (H - T - B);
  const grid = [lo + pad, (lo + hi) / 2, hi - pad].map(v => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/>
    <text x="${L - 6}" y="${y(v) + 4}" text-anchor="end" font-size="10" fill="var(--muted)">${Math.round(v)}</text>`).join('');
  const line = pts.map(p => `${x(p)},${y(p.v)}`).join(' ');
  const dots = pts.map(p => `<circle cx="${x(p)}" cy="${y(p.v)}" r="3.5" fill="${color}"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(unit)} 變化">${grid}
    <polyline points="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linejoin="round"/>${dots}
    <text x="${L}" y="${H - 6}" font-size="10" fill="var(--muted)">${md(d0)}</text>
    <text x="${W - R}" y="${H - 6}" font-size="10" fill="var(--muted)" text-anchor="end">${md(dN)}</text></svg>`;
}

/* 統計：週／月／年 */
let tPeriod = 'month', tAnchor = TODAY, tFilter = '全部';
function periodRange() {
  const [y, m] = tAnchor.split('-').map(Number);
  if (tPeriod === 'week') { const dow = (new Date(tAnchor + 'T00:00:00').getDay() + 6) % 7; const a = addDays(tAnchor, -dow); return [a, addDays(a, 6)]; }
  if (tPeriod === 'year') return [`${y}-01-01`, `${y}-12-31`];
  return [iso(new Date(y, m - 1, 1)), iso(new Date(y, m, 0))];
}
function shiftPeriod(dir) {
  const [y, m, d] = tAnchor.split('-').map(Number);
  tAnchor = tPeriod === 'week' ? addDays(tAnchor, 7 * dir) : tPeriod === 'year' ? iso(new Date(y + dir, 0, 1)) : iso(new Date(y, m - 1 + dir, 1));
  render();
}
function periodTitle() {
  const [a, b] = periodRange();
  if (tPeriod === 'week') return `${md(a)} – ${md(b)}`;
  if (tPeriod === 'year') return `${a.slice(0, 4)} 年`;
  return `${a.slice(0, 4)} 年 ${+a.slice(5, 7)} 月`;
}
function daysIn(a, b) { const out = []; for (let d = a; d <= b; d = addDays(d, 1)) out.push(d); return out; }
const counts = d => d >= CONFIG.START && d <= TODAY;
const expectedOn = (it, d) => !isCourse(it) || (daysBetween(CONFIG.START, d) % interval(it) === 0);
function itemDays(it) { return new Set(logsOf(it.id).map(l => l.date)); }
function statItems() { return S.items.filter(i => i.active && (tFilter === '全部' || i.domain === tFilter)); }
function dayStat(d, items, sets) {
  const exp = items.filter(it => expectedOn(it, d)).length;
  const done = items.filter(it => sets.get(it.id).has(d)).length;
  return { exp, done };
}
function ringSVG(p) {
  const r = 52, c = 2 * Math.PI * r;
  return `<svg viewBox="0 0 130 130" class="ring"><circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--line)" stroke-width="10"/>
    <circle cx="65" cy="65" r="${r}" fill="none" stroke="var(--lily)" stroke-width="10" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - Math.min(1, p))}" transform="rotate(-90 65 65)"/></svg>`;
}
function cellLevel(done, exp) { if (!done) return 0; const r = exp ? done / exp : 1; return r >= 1 ? 4 : r >= .6 ? 3 : r >= .3 ? 2 : 1; }

function overallHTML(items, sets) {
  const [a, b] = periodRange(), days = daysIn(a, b), valid = days.filter(counts);
  let sumExp = 0, sumDone = 0, full = 0, best = 0, run = 0, logsN = 0;
  valid.forEach(d => {
    const st = dayStat(d, items, sets); sumExp += st.exp; sumDone += Math.min(st.done, st.exp || st.done);
    if (st.exp && st.done >= st.exp) full++;
    if (st.done) { run++; best = Math.max(best, run); } else run = 0;
  });
  const ids = new Set(items.map(i => i.id));
  logsN = S.logs.filter(l => ids.has(l.item) && l.date >= a && l.date <= b).length;
  const rate = sumExp ? sumDone / sumExp : 0;
  let cal = '';
  if (tPeriod === 'year') {
    cal = `<div class="cal y">${Array.from({ length: 12 }, (_, i) => {
      const ms = `${a.slice(0, 4)}-${String(i + 1).padStart(2, '0')}`;
      const ds = valid.filter(d => d.startsWith(ms)); let e = 0, dn = 0;
      ds.forEach(d => { const st = dayStat(d, items, sets); e += st.exp; dn += Math.min(st.done, st.exp || st.done); });
      return `<div class="c l${ds.length ? cellLevel(dn, e) : 0} ${ds.length ? '' : 'off'}"><b>${i + 1} 月</b><span>${e ? Math.round(dn / e * 100) + '%' : ''}</span></div>`;
    }).join('')}</div>`;
  } else {
    const lead = tPeriod === 'month' ? (new Date(a + 'T00:00:00').getDay() + 6) % 7 : 0;
    cal = `<div class="cal">${'一二三四五六日'.split('').map(w => `<div class="w">${w}</div>`).join('')}${'<div></div>'.repeat(lead)}${days.map(d => {
      const st = counts(d) ? dayStat(d, items, sets) : null;
      return `<div class="c l${st ? cellLevel(st.done, st.exp) : 0} ${st ? '' : 'off'} ${d === TODAY ? 'today' : ''}">${+d.slice(8)}</div>`;
    }).join('')}</div>`;
  }
  return `<div class="card">${cal}
    <div class="ringbox">${ringSVG(rate)}<div class="rc"><b>${(rate * 100).toFixed(1)}%</b><span>完成率</span></div></div>
    <div class="kpis four">
      <div class="kpi"><b>${best}</b><span>最佳連續天數</span></div>
      <div class="kpi"><b>${full}</b><span>全部完成的天數</span></div>
      <div class="kpi"><b>${logsN}</b><span>完成次數</span></div>
      <div class="kpi"><b>${valid.length ? (logsN / valid.length).toFixed(1) : 0}</b><span>平均每天</span></div>
    </div></div>`;
}

function habitCard(it, sets) {
  const [a, b] = periodRange(), days = daysIn(a, b), set = sets.get(it.id);
  const valid = days.filter(counts), exp = valid.filter(d => expectedOn(it, d)).length;
  const done = valid.filter(d => set.has(d)).length;
  let grid;
  if (tPeriod === 'year') {
    grid = `<div class="mini y">${Array.from({ length: 12 }, (_, i) => {
      const ms = `${a.slice(0, 4)}-${String(i + 1).padStart(2, '0')}`;
      const ds = valid.filter(d => d.startsWith(ms)), e = ds.filter(d => expectedOn(it, d)).length, dn = ds.filter(d => set.has(d)).length;
      return `<i class="l${ds.length ? cellLevel(dn, e) : 0} ${ds.length ? '' : 'off'}">${i + 1}</i>`;
    }).join('')}</div>`;
  } else {
    const lead = tPeriod === 'month' ? (new Date(a + 'T00:00:00').getDay() + 6) % 7 : 0;
    grid = `<div class="mini">${'<i class="blank"></i>'.repeat(lead)}${days.map(d => `<i class="${set.has(d) ? 'l4' : ''} ${counts(d) ? '' : 'off'}">${+d.slice(8)}</i>`).join('')}</div>`;
  }
  return `<button class="hcard" style="--c:${colorOf(it)}" onclick="openDetail('${it.id}')">
    <span class="hname">${esc(it.short || it.name)}</span>${grid}
    <span class="hfoot"><b>${exp ? Math.round(Math.min(done, exp) / exp * 100) : 0}%</b><span>${done} 天</span></span></button>`;
}

function renderTrack() {
  const active = S.items.filter(i => i.active), archived = S.items.filter(i => !i.active);
  const domains = ['全部', ...DOMAINS.filter(d => active.some(i => i.domain === d))];
  if (!domains.includes(tFilter)) tFilter = '全部';
  const items = statItems(), sets = new Map(S.items.map(i => [i.id, itemDays(i)]));
  let html = `<div class="seg three" style="margin-top:20px">${[['week', '週報表'], ['month', '月報表'], ['year', '年報表']].map(([k, t]) =>
      `<button class="${tPeriod === k ? 'on' : ''}" onclick="tPeriod='${k}';render()">${t}</button>`).join('')}</div>
    <div class="chips">${domains.map(d => `<button class="chip ${tFilter === d ? 'on' : ''}" onclick="tFilter='${d}';render()">${d}</button>`).join('')}</div>
    <div class="pnav"><button onclick="shiftPeriod(-1)" aria-label="上一段">‹</button><b>${periodTitle()}</b><button onclick="shiftPeriod(1)" aria-label="下一段">›</button></div>
    ${overallHTML(items, sets)}`;
  html += section('每個項目', tPeriod === 'year' ? '每格一個月' : '有練的日子會亮起來', `<div class="habits">${items.map(it => habitCard(it, sets)).join('')}</div>`);
  // BPM 與進度
  const groups = [];
  const drum = items.filter(i => i.domain === '爵士鼓' && !isCourse(i));
  [...new Set(drum.map(i => i.cat || '其他'))].sort((a, b) => (CAT_ORDER.indexOf(a) + 99) % 99 - (CAT_ORDER.indexOf(b) + 99) % 99)
    .forEach(c => groups.push([c, drum.filter(i => (i.cat || '其他') === c)]));
  const rest = items.filter(i => !(i.domain === '爵士鼓' && !isCourse(i)));
  if (rest.length) groups.push(['網課與其他', rest]);
  groups.forEach(([t, list]) => html += section(t, 'BPM 與進度', list.map(trackRow).join('')));
  if (archived.length && tFilter === '全部') html += section('已封存', '', archived.map(trackRow).join(''));
  html += `<button class="more" onclick="openEdit()">＋ 新增練習項目</button>`;
  main.innerHTML = html;
}
function trackRow(it) {
  const s = series(it), n = logsOf(it.id).length;
  let val = '', unit = '';
  if (isCourse(it)) { val = `${it.prog || 0}/${it.target}`; unit = '堂'; }
  else if (s.kind === 'BPM' || it.bpm != null) { val = it.bpm ?? '—'; unit = 'BPM'; }
  else if (it.prog != null) { val = it.prog; unit = it.unit; }
  else { val = '—'; }
  return `<button class="trow" onclick="openDetail('${it.id}')">
    <span class="meta"><span class="name">${it.short ? `<span class="short" style="--c:${colorOf(it)}">${esc(it.short)}</span>` : ''}${esc(it.name)}</span>
      <span class="sub">${n ? `練了 ${n} 次，${ageText(it.id)[0]}` : '還沒有紀錄'}</span></span>
    ${sparkSVG(s.pts, colorOf(it))}
    <span class="val"><b>${esc(val)}</b><span>${esc(unit)}</span></span></button>`;
}

function openDetail(id) {
  const it = S.items.find(i => i.id === id), L = logsOf(id), s = series(it);
  const first = s.pts[0]?.v, last = s.pts[s.pts.length - 1]?.v;
  const gain = first != null && last != null ? last - first : null;
  const days = new Set(L.map(l => l.date)).size;
  const hist = [...L].reverse().map(l => {
    const v = [l.prog != null ? `第 ${l.prog} ${esc(it.unit || '')}` : '', l.bpm != null ? `${l.bpm} BPM` : ''].filter(Boolean).join('，') || '有練';
    return `<span class="d">${md(l.date)}</span><span>${v}${l.note ? `<br><span class="sub">${esc(l.note)}</span>` : ''}</span>`;
  }).join('');
  openSheet(`${sheetHead(it.name, it.id)}
    <p class="hint">${esc([it.domain, it.cat].filter(Boolean).join('／'))}${it.active ? '' : '，已封存'}</p>
    ${chartSVG(s.pts, colorOf(it), s.kind)}
    <div class="kpis">
      <div class="kpi"><b>${days}</b><span>練習天數</span></div>
      <div class="kpi"><b>${last ?? '—'}</b><span>最近 ${esc(s.kind)}</span></div>
      <div class="kpi"><b>${gain == null ? '—' : (gain > 0 ? '+' : '') + gain}</b><span>從第一次到現在</span></div>
    </div>
    ${hist ? `<div class="hist">${hist}</div>` : ''}
    <button class="ghost ${it.active ? 'danger' : ''}" id="btnArchive">${it.active ? '封存這個項目' : '恢復這個項目'}</button>
    <button class="ghost" onclick="closeSheet()">關閉</button>`);
  document.getElementById('btnArchive').onclick = async () => {
    if (it.active && !confirm(`封存「${it.name}」？封存後不會出現在今日菜單，紀錄都會保留。`)) return;
    try {
      await notion(`pages/${it.id}`, 'PATCH', { properties: { '啟用': { checkbox: !it.active } } });
      it.active = !it.active; closeSheet(); render(); toast(it.active ? '已恢復' : '已封存');
    } catch (e) { toast('沒有存到：' + e.message); }
  };
}



/* ---------- 打卡 ---------- */
function nowISO() {
  const d = new Date(), off = -d.getTimezoneOffset(), pad = n => String(Math.floor(Math.abs(n))).padStart(2, '0');
  return `${iso(d)}T${d.toTimeString().slice(0, 8)}${off >= 0 ? '+' : '-'}${pad(off / 60)}:${pad(off % 60)}`;
}
const hm = t => new Date(t).toTimeString().slice(0, 5);
const fmtMin = m => m >= 60 ? `${Math.floor(m / 60)} 小時 ${Math.round(m % 60)} 分` : `${Math.round(m)} 分鐘`;
// iPhone 捷徑只會寫入「到達」「離開」兩種紀錄，這裡把它們配對成一次練習
async function syncSessions() {
  const recs = (await queryAll(CONFIG.DB.sessions, { filter: { property: '開始', date: { on_or_after: addDays(CONFIG.START, -1) } }, sorts: [{ property: '開始', direction: 'ascending' }] }))
    .map(pg => ({ id: nid(pg.id), name: P.title(pg.properties['名稱']), start: pg.properties['開始']?.date?.start || '', end: pg.properties['結束']?.date?.start || '', src: P.sel(pg.properties['來源']) }));
  const drop = new Set();
  for (const lv of recs.filter(r => r.name === '離開')) {
    const cand = recs.filter(r => r.name !== '離開' && !r.end && !drop.has(r.id) && Date.parse(r.start) < Date.parse(lv.start)).pop();
    drop.add(lv.id);
    const jobs = [notion(`pages/${lv.id}`, 'PATCH', { archived: true })];
    if (cand) {
      const mins = (Date.parse(lv.start) - Date.parse(cand.start)) / 60000;
      if (mins < 10) { drop.add(cand.id); jobs.push(notion(`pages/${cand.id}`, 'PATCH', { archived: true })); } // 只是路過
      else { cand.end = lv.start; cand.name = '鼓房練習';
        jobs.push(notion(`pages/${cand.id}`, 'PATCH', { properties: { '結束': { date: { start: lv.start } }, '名稱': { title: [{ text: { content: '鼓房練習' } }] } } })); }
    }
    await Promise.all(jobs);
  }
  return recs.filter(r => !drop.has(r.id));
}
function punchCard() {
  const done = S.sessions.filter(r => r.end).reduce((a, r) => a + (Date.parse(r.end) - Date.parse(r.start)) / 60000, 0);
  if (S.open) {
    const mins = (Date.now() - Date.parse(S.open.start)) / 60000;
    return `<div class="punch on"><div class="pt"><b>練習中，已 ${fmtMin(mins)}</b><span>${hm(S.open.start)} 開始${S.open.src === '自動' ? '，自動打卡' : ''}</span></div>
      <button onclick="punch()">結束練習</button></div>`;
  }
  return `<div class="punch"><div class="pt"><b>${done ? '今天練了 ' + fmtMin(done) : '尚未練習'}</b><span>${done ? S.sessions.filter(r => r.end).length + ' 次打卡' : '手動／自動開始皆可'}</span></div>
    <button onclick="punch()">${done ? '再練一次' : '開始練習'}</button></div>`;
}
async function punch() {
  try {
    if (S.open) {
      const end = nowISO();
      await notion(`pages/${S.open.id}`, 'PATCH', { properties: { '結束': { date: { start: end } }, '名稱': { title: [{ text: { content: '鼓房練習' } }] } } });
      S.open.end = end; const mins = (Date.parse(end) - Date.parse(S.open.start)) / 60000; S.open = null;
      toast('辛苦了，這次練了 ' + fmtMin(mins));
    } else {
      const start = nowISO();
      const pg = await notion('pages', 'POST', { parent: { database_id: CONFIG.DB.sessions }, properties: {
        '名稱': { title: [{ text: { content: '鼓房練習' } }] }, '開始': { date: { start } }, '來源': { select: { name: '手動' } } } });
      S.open = { id: nid(pg.id), name: '鼓房練習', start, end: '', src: '手動' };

/* ---------- 紀錄 ---------- */
let recTab = 'daily';
const WD = s => '日一二三四五六'[new Date(s + 'T00:00:00').getDay()];
const sessMin = r => r.end ? (Date.parse(r.end) - Date.parse(r.start)) / 60000 : 0;
function renderRecords() {
  let html = `<div class="seg"><button class="${recTab === 'daily' ? 'on' : ''}" onclick="recTab='daily';render()">每日練習</button>
    <button class="${recTab === 'punch' ? 'on' : ''}" onclick="recTab='punch';render()">打卡紀錄</button></div>`;
  html += recTab === 'daily' ? dailyHTML() : punchHTML();
  main.innerHTML = html;
}
function dailyHTML() {
  const dates = [...new Set([...S.logs.map(l => l.date), ...S.allSessions.map(r => r.start.slice(0, 10))])].filter(d => d >= CONFIG.START).sort().reverse();
  if (!dates.length) return `<p class="empty" style="margin-top:20px">還沒有紀錄。在今日菜單點項目記下 BPM 或進度，就會出現在這裡。</p>`;
  return dates.map(d => {
    const logs = S.logs.filter(l => l.date === d);
    const mins = S.allSessions.filter(r => r.start.slice(0, 10) === d).reduce((a, r) => a + sessMin(r), 0);
    const rows = logs.map(l => {
      const it = S.items.find(i => i.id === l.item) || { name: '（已刪除的項目）' };
      const v = [l.prog != null ? `第 ${l.prog} ${esc(it.unit || '')}` : '', l.bpm != null ? `${l.bpm} BPM` : ''].filter(Boolean).join('，');
      return `<button class="rec" onclick="openLogEdit('${l.id}')"><span class="r1">${it.short ? `<span class="short" style="--c:${colorOf(it)}">${esc(it.short)}</span>` : ''}${esc(it.name)}</span>
        <span class="r2">${v || '有練'}</span>${l.note ? `<span class="r3">${esc(l.note)}</span>` : ''}</button>`;
    }).join('');
    return `<div class="day"><h3>${md(d)} 星期${WD(d)}<small>${logs.length} 項${mins ? `，鼓房 ${fmtMin(mins)}` : ''}</small></h3>${rows || '<p class="empty">只有打卡，沒有記錄項目</p>'}</div>`;
  }).join('');
}
function punchHTML() {
  const recs = S.allSessions.filter(r => r.start.slice(0, 10) >= CONFIG.START);
  const m = TODAY.slice(0, 7), monthMin = recs.filter(r => r.start.startsWith(m)).reduce((a, r) => a + sessMin(r), 0);
  let html = `<div class="kpis" style="margin-top:18px">
    <div class="kpi"><b>${new Set(recs.filter(r => r.start.startsWith(m)).map(r => r.start.slice(0, 10))).size}</b><span>本月去鼓房天數</span></div>
    <div class="kpi"><b>${Math.round(monthMin / 6) / 10}</b><span>本月練習小時</span></div>
    <div class="kpi"><b>${recs.length}</b><span>總打卡次數</span></div></div>
    <button class="more" style="margin-top:4px" onclick="openSession()">＋ 補登打卡</button>`;
  const dates = [...new Set(recs.map(r => r.start.slice(0, 10)))].sort().reverse();
  html += dates.map(d => {
    const list = recs.filter(r => r.start.slice(0, 10) === d);
    const tot = list.reduce((a, r) => a + sessMin(r), 0);
    return `<div class="day"><h3>${md(d)} 星期${WD(d)}<small>${tot ? fmtMin(tot) : ''}</small></h3>${list.map(r => `

const toLocalInput = t => t ? `${iso(new Date(t))}T${new Date(t).toTimeString().slice(0, 5)}` : '';
function isoFromInput(v) {
  const d = new Date(v), off = -d.getTimezoneOffset(), pad = n => String(Math.floor(Math.abs(n))).padStart(2, '0');
  return `${iso(d)}T${d.toTimeString().slice(0, 8)}${off >= 0 ? '+' : '-'}${pad(off / 60)}:${pad(off % 60)}`;
}

const PENCIL = '<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>';
const PLAY = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><rect x="2.5" y="5" width="19" height="14" rx="3"/><path d="M10 9.2v5.6l4.8-2.8Z" fill="currentColor"/></svg>';
const sheetHead = (title, id) => `<div class="shead"><h3>${esc(title)}</h3><span class="sbtns"><span id="lk"></span><button class="iconbtn" aria-label="編輯項目" onclick="openEdit('${id}')">${PENCIL}</button></span></div>`;
const sheet = document.getElementById('sheet'), scrim = document.getElementById('scrim');
function openSheet(html) { sheet.innerHTML = html; sheet.scrollTop = 0; scrim.classList.add('open'); sheet.classList.add('open'); }
function closeSheet() { scrim.classList.remove('open'); sheet.classList.remove('open'); }
scrim.onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
function stepper(id, val, step) {
  return `<div class="stepper"><button type="button" onclick="bump('${id}',-${step})">−</button>
    <input id="${id}" type="number" inputmode="numeric" value="${val ?? ''}"><button type="button" onclick="bump('${id}',${step})">＋</button></div>`;
}
function bump(id, n) { const el = document.getElementById(id); el.value = (+el.value || 0) + n; }

async function linkFromPage(it) {
  try {
    const r = await notion(`blocks/${it.id}/children?page_size=50`);
    for (const b of r.results) for (const t of (b[b.type]?.rich_text || [])) if (t.href) return t.href;
  } catch (e) {}
  return '';
}

async function openLog(id) {
  const it = S.items.find(i => i.id === id);
  const course = isCourse(it), drum = it.domain === '爵士鼓' && !course;
  const progVal = course ? (it.prog || 0) + (doneToday(id) ? 0 : 1) : it.prog;
  openSheet(`${sheetHead(it.name, it.id)}
    <p class="hint">${course ? '上完一堂就記下來' : drum ? '填今天能乾淨打到的速度' : '記下今天的進度'}</p>
    ${course || it.unit ? `<div class="field"><label>${course ? '上到第幾堂' : `練到第幾${esc(it.unit)}`}</label>${stepper('fProg', progVal, 1)}</div>` : ''}
    ${drum ? `<div class="field"><label>BPM${it.bpm != null ? `（目前最高 ${it.bpm}）` : ''}</label>${stepper('fBpm', it.bpm, 5)}</div>` : ''}
    <div class="field"><label>備註</label><textarea id="fNote" rows="2" placeholder="哪裡卡住、下次要注意什麼"></textarea></div>
    <button class="primary" id="btnSave">記錄完成</button>
    <button class="ghost" onclick="closeSheet()">取消</button>`);
  document.getElementById('btnSave').onclick = () => saveLog(it, drum);
  const href = await linkFromPage(it), lk = document.getElementById('lk');
  if (href && lk) lk.innerHTML = `<a class="iconbtn" href="${esc(href)}" target="_blank" rel="noopener" aria-label="${course ? '開啟課程' : '開啟參考影片'}" style="color:var(--water)">${PLAY}</a>`;
}

async function saveLog(it, drum) {
  const val = id => { const el = document.getElementById(id); return el && el.value !== '' ? +el.value : null; };
  const prog = val('fProg'), bpm = drum ? val('fBpm') : null, note = document.getElementById('fNote').value.trim();
  const btn = document.getElementById('btnSave'); btn.disabled = true; btn.textContent = '儲存中…';
  const props = {
    '名稱': { title: [{ text: { content: `${it.short || it.name} ${VIEW}` } }] },
    '日期': { date: { start: VIEW } },
    '項目': { relation: [{ id: it.id }] },
  };
  if (prog != null) props['進度'] = { number: prog };
  if (bpm != null) props['BPM'] = { number: bpm };
  if (note) props['備註'] = { rich_text: [{ text: { content: note } }] };
  if (it.domain === '爵士鼓' && S.session && VIEW === TODAY) props['練習時段'] = { relation: [{ id: S.session }] };
  try {
    const pg = await notion('pages', 'POST', { parent: { database_id: CONFIG.DB.logs }, properties: props });
    const upd = {}; let record = false;
    if (bpm != null && (it.bpm == null || bpm > it.bpm)) { upd['目前BPM'] = { number: bpm }; record = it.bpm != null; it.bpm = bpm; }
    if (prog != null && (it.prog == null || prog > it.prog)) { upd['目前進度'] = { number: prog }; it.prog = prog; }
    if (Object.keys(upd).length) await notion(`pages/${it.id}`, 'PATCH', { properties: upd });
    S.logs.push({ id: nid(pg.id), item: it.id, date: VIEW, bpm, prog, note });
    closeSheet(); render();
    toast(record ? `新紀錄！${it.short || it.name} ${bpm} BPM` : '已記錄');
  } catch (e) { btn.disabled = false; btn.textContent = '記錄完成'; toast('沒有存到：' + e.message); }
}

function openSong(id) {
  const s = S.songs.find(x => x.id === id), opts = ['未抓歌', '還沒練', '不穩', '可以上台'];
  openSheet(`<h3>${esc(s.name)}</h3><p class="hint">這首現在的狀態是？</p>
    <div class="choices">${opts.map(o => `<button class="choice ${s.status === o ? 'on' : ''}" data-v="${o}">${o}</button>`).join('')}</div>
    <button class="primary" id="btnSong">記錄完成</button><button class="ghost" onclick="closeSheet()">取消</button>`);
  let pick = s.status || '不穩';
  sheet.querySelectorAll('.choice').forEach(b => b.onclick = () => { pick = b.dataset.v; sheet.querySelectorAll('.choice').forEach(x => x.classList.toggle('on', x === b)); });
  document.getElementById('btnSong').onclick = async () => {
    const btn = document.getElementById('btnSong'); btn.disabled = true; btn.textContent = '儲存中…';
    try {
      const last = !s.last || VIEW > s.last ? VIEW : s.last;
      await notion(`pages/${s.id}`, 'PATCH', { properties: { '狀態': { select: { name: pick } }, '上次練習': { date: { start: last } } } });
      s.status = pick; s.last = last; S.songsDone.add(s.id);
      localStorage.setItem('dailyMenu.songsDone.' + VIEW, JSON.stringify([...S.songsDone]));
      closeSheet(); render(); toast(pick === '可以上台' ? `${s.name} 可以上台了` : '已記錄');
    } catch (e) { btn.disabled = false; btn.textContent = '記錄完成'; toast('沒有存到：' + e.message); }
  };
}

function openSettings() {
  openSheet(`<h3>設定</h3>
    <div class="field"><label>Notion token</label><input id="fTok" type="password" value="${esc(token)}" placeholder="ntn_ 開頭"></div>
    <button class="primary" id="btnTok">儲存並重新讀取</button>
    <button class="ghost" onclick="openVersions()">版本紀錄（v${APP_VERSION}）</button>
    <button class="ghost" onclick="closeSheet()">關閉</button>`);
  document.getElementById('btnTok').onclick = () => { token = document.getElementById('fTok').value.trim(); localStorage.setItem(TOKEN_KEY, token); closeSheet(); load(); };
}
function renderSetup() {
  header();
  main.innerHTML = `<div class="notice"><p><b>先連上 Notion</b></p><p>貼上「爵士鼓教學系統」integration 的 token，就會讀取今天的菜單。</p>
    <button class="primary" onclick="openSettings()">輸入 token</button></div>`;
}
let tt; function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(() => t.classList.remove('show'), 2400); }

document.querySelectorAll('.tab').forEach(b => b.onclick = () => {
  view = b.dataset.v; document.querySelectorAll('.tab').forEach(x => x.classList.toggle('on', x === b));
  window.scrollTo(0, 0); render();
});
document.getElementById('btnSettings').onclick = openSettings;
// 回到 app 時自動更新（離開超過 1 分鐘）
let hiddenAt = 0;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) hiddenAt = Date.now();
  else if (hiddenAt && Date.now() - hiddenAt > 60000) { hiddenAt = 0; load(true); }
});
setInterval(() => { if (!document.hidden && view === 'today' && S.open) render(); }, 60000);
header(); load();
</script>
</body>
</html>
